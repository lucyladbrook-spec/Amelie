<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amelie's Physics Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Nunito:wght@400;600;700&family=Caveat:wght@500&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Amelie's Physics Club — a romantic-academia study journal.
   Ivory pages, blush and ballet pink layers, chocolate ink, sage for "done", honey for exam warnings.
   Display: Playfair Display (editorial serif). UI + content: Nunito (rounded sans). Accent: Caveat, used sparingly. */
:root {
  --ivory: #FFFDF8; --cream: #F5EFE8; --powder: #F8EDEF; --ballet: #F2D8DF; --blush: #E9BFCB; --rose: #C58D9E; --cocoa: #59434A; --sage: #B6C4AD;
  --bg: var(--ivory);
  --surface: #FFFFFF;
  --ink: #59434A;
  --muted: #7A6168;
  --line: #EEDFDC;
  --blue: #8E3B5A;          /* deep berry: links, key learning, focus */
  --blue-soft: var(--powder);
  --pink-mid: var(--ballet);
  --head: var(--ivory);
  --green: #6E8A64; --green-ink: #4A6343; --green-soft: #E7EEE2;
  --amber: #B07A3A; --amber-ink: #8A5A22; --amber-soft: #F7ECDD;
  --help: var(--ballet); --help-ink: #7E2F4C;
  --btn: var(--blush); --btn-ink: var(--cocoa);
  --font-display: "Playfair Display", "Georgia", serif;
  --font-ui: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Caveat", "Segoe Script", cursive;
  --r-lg: 22px; --r-md: 14px; --r-sm: 10px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 36px; --s7: 56px;
  --shadow: 0 1px 2px rgba(89, 67, 74, .05), 0 10px 30px rgba(197, 141, 158, .12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #211a1c; --surface: #2b2225; --ink: #f4e7ea; --muted: #c9b3ba; --line: #3d3034; --cream: #2f2629; --powder: #36292d;
    --blue: #f0b4c8; --blue-soft: #3a2b30; --pink-mid: #4a3238; --head: #211a1c;
    --green: #a9c29e; --green-ink: #c4dbb9; --green-soft: #2c3529; --amber: #e2b47a; --amber-ink: #f0cf9f; --amber-soft: #3a2f22;
    --help: #4a3238; --help-ink: #f6c6d6; --btn: #6b4553; --btn-ink: #fff4f7; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #211a1c; --surface: #2b2225; --ink: #f4e7ea; --muted: #c9b3ba; --line: #3d3034; --cream: #2f2629; --powder: #36292d;
  --blue: #f0b4c8; --blue-soft: #3a2b30; --pink-mid: #4a3238; --head: #211a1c;
  --green: #a9c29e; --green-ink: #c4dbb9; --green-soft: #2c3529; --amber: #e2b47a; --amber-ink: #f0cf9f; --amber-soft: #3a2f22;
  --help: #4a3238; --help-ink: #f6c6d6; --btn: #6b4553; --btn-ink: #fff4f7; --shadow: none; color-scheme: dark;
}
html { font-size: 100%; }
html.ts-large { font-size: 112.5%; }
html.ts-xl { font-size: 125%; }
html.clear-font { --font-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 1.0625rem; line-height: 1.65; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 500; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h2 { font-size: 1.7rem; }
h3 { font-size: 1.2rem; }
h4 { font-size: 1.02rem; font-family: var(--font-ui); font-weight: 700; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 1.2em; height: 1.2em; flex: none; display: inline-block; vertical-align: -0.2em; }
.ico svg { width: 100%; height: 100%; display: block; }
.hand { font-family: var(--font-hand); font-size: 1.45rem; color: var(--blue); line-height: 1.1; }

/* header + wordmark */
.top { background: var(--head); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.top-in { max-width: 1080px; margin: 0 auto; padding: var(--s3) var(--s4) var(--s2); display: grid; gap: var(--s2); }
.brand { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); }
.wordmark { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.wordmark .bow { width: 30px; height: 22px; color: var(--rose); }
.wordmark h1 { font-size: 1.45rem; font-weight: 500; font-style: italic; }
.wordmark small { display: block; font-family: var(--font-ui); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-style: normal; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
nav.tabs a { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; min-height: 44px; border-radius: 99px; text-decoration: none; color: var(--muted); font-size: .92rem; font-weight: 600; }
nav.tabs a .ico { color: var(--rose); }
nav.tabs a:hover { color: var(--ink); background: var(--powder); }
nav.tabs a[aria-current="page"] { background: var(--ballet); color: var(--ink); }
main { max-width: 1080px; margin: 0 auto; padding: var(--s6) var(--s4) var(--s7); }
.view { display: grid; gap: var(--s5); }
.narrow { max-width: 780px; width: 100%; margin: 0 auto; }

/* dividers + small editorial details */
.divider { display: flex; align-items: center; gap: var(--s3); color: var(--rose); }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.divider .ico { width: 18px; height: 18px; }

/* components */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s5); box-shadow: var(--shadow); display: grid; gap: var(--s4); }
.card.tight { padding: var(--s4) var(--s5); gap: var(--s3); }
.card.cream { background: var(--cream); box-shadow: none; }
.eyebrow { font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; color: var(--blue); display: flex; align-items: center; gap: 8px; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: .92rem; }
.row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.between { justify-content: space-between; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 20px; min-height: 48px; border-radius: 99px; text-decoration: none; font-size: .95rem; font-weight: 700; }
.btn:hover { border-color: var(--rose); background: var(--powder); }
.btn.primary { background: var(--btn); border-color: var(--rose); color: var(--btn-ink); }
.btn.primary:hover { background: var(--ballet); }
.btn.big { font-size: 1.08rem; padding: 14px 30px; min-height: 58px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--blue); padding-left: 12px; padding-right: 12px; }
.btn.small { min-height: 40px; padding: 6px 14px; font-size: .88rem; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 600; padding: 3px 11px; border-radius: 99px; background: var(--cream); border: 1px solid var(--line); white-space: nowrap; }
.chip.eq { background: var(--powder); border-color: var(--ballet); font-size: .95rem; font-weight: 600; }
.chip.got, .chip.done { background: var(--green-soft); color: var(--green-ink); border-color: transparent; }
.chip.getting { background: var(--cream); color: var(--ink); border-color: var(--line); }
.chip.help { background: var(--help); color: var(--help-ink); border-color: transparent; }
.bar { height: 6px; background: var(--powder); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--rose); border-radius: 99px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.ticklist { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.ticklist li { display: grid; grid-template-columns: 28px 1fr; gap: var(--s2); align-items: start; }
.ticklist li .ico { color: var(--rose); margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--s4); }
.subnav { display: flex; gap: var(--s2); flex-wrap: wrap; }
.subnav a { padding: 8px 18px; border-radius: 99px; border: 1px solid var(--line); text-decoration: none; color: var(--muted); min-height: 44px; display: inline-flex; align-items: center; background: var(--surface); font-weight: 600; }
.subnav a[aria-current="page"] { background: var(--cocoa); color: var(--ivory); border-color: var(--cocoa); }
:root[data-theme="dark"] .subnav a[aria-current="page"] { background: var(--blue); color: #211a1c; border-color: var(--blue); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .subnav a[aria-current="page"] { background: var(--blue); color: #211a1c; border-color: var(--blue); } }

/* illustrations */
.motif { color: var(--rose); }
.motif svg { width: 100%; height: 100%; display: block; }
.arch { background: var(--ballet); border-radius: 999px 999px var(--r-lg) var(--r-lg); display: grid; place-items: center; padding: 28px 22px 22px; aspect-ratio: 4 / 5; max-width: 240px; width: 100%; justify-self: center; }
.arch .motif { width: 80%; color: var(--cocoa); opacity: .85; }

/* home */
.welcome { display: grid; gap: 4px; }
.welcome h2 { font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 500; font-style: italic; }
.today { padding: var(--s6); display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--s6); align-items: center; background: var(--surface); }
.today h2 { font-size: 2.1rem; }
.today-body { display: grid; gap: var(--s4); }
.meta { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); color: var(--muted); font-size: .95rem; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta .ico { color: var(--rose); }
.week-row { display: grid; grid-template-columns: 44px 1fr auto; gap: var(--s3); align-items: center; padding: var(--s2) var(--s3); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.week-row.is-next { border: 2px solid var(--blush); background: var(--powder); }
.week-row.is-done { background: var(--green-soft); border-color: transparent; }
.tick { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--rose); background: var(--surface); display: grid; place-items: center; color: var(--surface); padding: 0; }
.tick[aria-checked="true"] { background: var(--green); border-color: var(--green); }
.tick .ico { width: 22px; height: 22px; }
.open-sess { text-align: left; background: none; border: 0; padding: 6px 0; display: grid; gap: 2px; min-height: 44px; }
.open-sess b { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; }
.open-sess span { font-size: .85rem; color: var(--muted); }
.reorder { display: flex; gap: 4px; align-items: center; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); padding: 0; color: var(--ink); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.stat { display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 2.2rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.pearls { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin: 0; padding: 0; }
.pearls a { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--blush); background: var(--surface); color: var(--muted); font-size: .78rem; font-weight: 700; text-decoration: none; }
.pearls a.got { background: var(--green-soft); border-color: var(--sage); color: var(--green-ink); }
.pearls a.getting { background: var(--cream); border-color: var(--rose); color: var(--ink); }
.pearls a.help { background: var(--ballet); border-color: var(--rose); color: var(--help-ink); }
.pearls a.done { box-shadow: inset 0 0 0 3px var(--surface); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s3); font-size: .85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid var(--blush); }

/* session journal page */
.studio { display: grid; gap: var(--s4); }
.studio-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--s3); }
.stepper { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; list-style: none; margin: 0; padding: 0; position: relative; }
.stepper button { width: 100%; display: grid; gap: 4px; justify-items: center; background: none; border: 0; padding: 6px 2px; color: var(--muted); font-size: .76rem; font-weight: 700; min-height: 56px; }
.stepper .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--blush); color: var(--rose); }
.stepper .dot .ico { width: 18px; height: 18px; }
.stepper [aria-current="step"] { color: var(--ink); }
.stepper [aria-current="step"] .dot { border-color: var(--blue); background: var(--blush); color: var(--cocoa); }
.stepper .seen .dot { border-color: var(--sage); background: var(--green-soft); color: var(--green-ink); }
@media (max-width: 560px) { .stepper .lbl { display: none; } }
.stage { padding: var(--s6); gap: var(--s5); background: var(--surface); border-top: 0; position: relative; }
.stage::before { content: ""; position: absolute; left: 24px; right: 24px; top: 0; height: 4px; border-radius: 0 0 6px 6px; background: var(--ballet); }
.stage-title { display: flex; align-items: center; gap: var(--s3); }
.stage-title h2 { font-size: 1.9rem; }
.stage-title .badge { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--ballet); color: var(--cocoa); flex: none; }
.stage-title .badge.amber { background: var(--amber-soft); color: var(--amber-ink); }
.stage-title .badge.green { background: var(--green-soft); color: var(--green-ink); }
.stage-foot { display: flex; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; border-top: 1px dashed var(--blush); padding-top: var(--s4); }
.objective { font-size: 1.15rem; }
.remember { background: var(--powder); border: 1px solid var(--ballet); border-radius: var(--r-md); padding: var(--s4) var(--s5); display: grid; gap: var(--s3); }
.remember h4 { color: var(--blue); font-family: var(--font-display); font-weight: 500; font-style: italic; font-size: 1.2rem; }
.idea { display: grid; grid-template-columns: 34px 1fr; gap: var(--s3); align-items: start; padding: var(--s3) 0; border-bottom: 1px dashed var(--line); }
.idea:last-child { border-bottom: 0; }
.idea .n { width: 30px; height: 30px; border-radius: 50%; background: var(--ballet); color: var(--cocoa); display: grid; place-items: center; font-size: .85rem; font-weight: 700; }
.vcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--s3); }
.vcard { border: 1px solid var(--ballet); border-radius: var(--r-md); padding: var(--s4); display: grid; gap: var(--s2); background: var(--powder); align-content: start; }
.vcard .word { font-family: var(--font-display); font-weight: 500; font-size: 1.2rem; }
.vcard .lab { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.vcard .vis { color: var(--rose); width: 56px; height: 56px; }
.vcard .ex { background: var(--surface); border-radius: var(--r-sm); padding: var(--s2) var(--s3); font-size: .95rem; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.step { display: grid; grid-template-columns: 42px 1fr; gap: var(--s3); align-items: start; padding: var(--s3) var(--s4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--cream); }
.step .n { width: 32px; height: 32px; border-radius: 50%; background: var(--cocoa); color: var(--ivory); display: grid; place-items: center; font-family: var(--font-display); font-size: .95rem; }
:root[data-theme="dark"] .step .n { background: var(--blue); color: #211a1c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .step .n { background: var(--blue); color: #211a1c; } }
.step .lab { font-size: .72rem; text-transform: uppercase; letter-spacing: .14em; color: var(--blue); font-weight: 700; }
.step .txt { font-size: 1.08rem; }
.answer-box { background: var(--green-soft); color: var(--ink); border-radius: var(--r-md); padding: var(--s4); display: flex; gap: var(--s3); align-items: center; }
.answer-box .ico { color: var(--green-ink); }
.answer-box b { font-family: var(--font-display); font-size: 1.2rem; font-weight: 500; }
.qcard { border: 1px solid var(--ballet); border-radius: var(--r-lg); padding: var(--s5); display: grid; gap: var(--s4); background: linear-gradient(var(--powder), var(--powder)) top / 100% 6px no-repeat, var(--surface); }
.qtext { font-size: 1.2rem; font-weight: 600; line-height: 1.5; }
.hint { background: var(--cream); border-radius: var(--r-md); padding: var(--s3) var(--s4); display: flex; gap: var(--s3); }
.hint .ico { color: var(--rose); margin-top: 3px; }
.numrow { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.numrow input { width: 180px; padding: 12px 16px; min-height: 48px; border: 2px solid var(--ballet); border-radius: 99px; background: var(--ivory); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.numrow input:focus { border-color: var(--blue); outline: none; }
.feedback { border-radius: var(--r-md); padding: var(--s3) var(--s4); display: flex; gap: var(--s3); align-items: flex-start; }
.feedback.ok { background: var(--green-soft); }
.feedback.ok .ico { color: var(--green-ink); }
.feedback.no { background: var(--powder); }
.feedback.no .ico { color: var(--rose); }
.watch { display: grid; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--line); }
.watch > div { padding: var(--s3) var(--s4); display: grid; grid-template-columns: 28px 1fr; gap: var(--s3); }
.watch .mis { background: var(--amber-soft); }
.watch .mis .ico, .watch .mis .lab { color: var(--amber-ink); }
.watch .fix { background: var(--surface); }
.watch .fix .ico, .watch .fix .lab { color: var(--green-ink); }
.watch .lab { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; display: block; font-weight: 700; }
.conf-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--s3); }
.conf-opts button { display: grid; gap: var(--s2); justify-items: start; text-align: left; padding: var(--s4); border: 2px solid var(--ballet); border-radius: var(--r-md); background: var(--surface); min-height: 96px; }
.conf-opts button b { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; }
.conf-opts button[aria-pressed="true"] { border-color: var(--rose); background: var(--powder); }
.conf-opts .ico { width: 26px; height: 26px; color: var(--rose); }
.timer { display: inline-flex; align-items: center; gap: var(--s2); border: 1px solid var(--ballet); border-radius: 99px; padding: 4px 6px 4px 14px; background: var(--surface); }
.timer .ico { color: var(--rose); }
.timer .clock { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: 1.15rem; min-width: 3.2em; }
.timer.brk { border-color: var(--sage); }
.timer-note { background: var(--green-soft); border-radius: var(--r-md); padding: var(--s3) var(--s4); display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; justify-content: space-between; }
.done-panel { text-align: center; justify-items: center; padding: var(--s7) var(--s5); background: var(--surface); }
.done-panel .big-tick { width: 84px; height: 84px; border-radius: 50%; background: var(--green-soft); color: var(--green-ink); display: grid; place-items: center; border: 2px solid var(--sage); }
.done-panel .big-tick .ico { width: 44px; height: 44px; }

/* diagrams: same science, softer ink */
.diagram { border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s4); display: grid; gap: var(--s3); background: var(--ivory); }
.diagram svg { width: 100%; max-width: 540px; height: auto; justify-self: center; }
.diagram .parts { display: flex; flex-wrap: wrap; gap: var(--s2); }
.diagram .parts button[aria-pressed="true"] { background: var(--ballet); border-color: var(--rose); }
.dg-line { stroke: var(--ink); stroke-width: 2; fill: none; }
.dg-box { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.dg-block { fill: var(--ballet); stroke: var(--ink); stroke-width: 2; }
.dg-ins { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 2; stroke-dasharray: 5 4; }
.dg-txt { fill: var(--ink); font-family: var(--font-ui); font-size: 12px; }

}

function currentWeekId() {
  const t = new Date(); let cur = WEEKS[0].id;

/* ============ timer ============ */
const T = { left: 25 * 60, phase: "work", run: null, ended: false, ctx: null };
function tText() { const m = Math.floor(T.left / 60), s = T.left % 60; return m + ":" + String(s).padStart(2, "0"); }
function beep() { if (!settings.sound || !T.ctx) return; try { const o = T.ctx.createOscillator(), g = T.ctx.createGain(); o.type = "sine"; o.frequency.value = 523; g.gain.value = 0.06; o.connect(g); g.connect(T.ctx.destination); o.start(); o.stop(T.ctx.currentTime + 0.5); } catch (e) {} }
function tTick() {
  T.left--;
  if (T.left <= 0) {
    clearInterval(T.run); T.run = null; beep();
    if (T.phase === "work") { T.phase = "break-ready"; T.left = 5 * 60; }
    else { T.phase = "work"; T.left = 25 * 60; T.ended = "break"; }
    if (T.phase === "break-ready") T.ended = "work";
  }
  paintTimer();
}
function tToggle() {
  try { if (!T.ctx) T.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  if (T.run) { clearInterval(T.run); T.run = null; }
  else { if (T.phase === "break-ready") T.phase = "break"; T.ended = false; T.run = setInterval(tTick, 1000); }
  paintTimer();
}
function tReset() { clearInterval(T.run); T.run = null; T.phase = "work"; T.left = 25 * 60; T.ended = false; paintTimer(); }
function timerEl() {

}

  const wrap = target || $("#timerWrap"); if (!wrap) return;

      h("span", { class: "sr" }, T.phase === "work" ? "focus time remaining" : "break time remaining"),
      h("button", { type: "button", class: "btn small", onclick: tToggle, "aria-label": label }, icon(T.run ? "pause" : "play"), T.run ? "Pause" : (T.phase === "work" ? "Start" : "Break")),
      (T.run || T.left !== 25 * 60 || T.phase !== "work") ? h("button", { type: "button", class: "btn small ghost", onclick: tReset }, "Reset") : null),
    T.ended === "work" ? h("div", { class: "timer-note", role: "status" }, h("span", {}, "25 minutes done. Good time for a 5-minute break: your place is saved."), h("button", { type: "button", class: "btn small", onclick: tToggle }, icon("coffee"), "Start break")) : null,
    T.ended === "break" ? h("div", { class: "timer-note", role: "status" }, h("span", {}, "Break over. Carry on when you're ready, or stop here.")) : null].filter(Boolean));
}

function diagramEl(id) {
  const d = DIAGRAMS[id]; if (!d) return null;
  const box = h("figure", { class: "diagram", style: "margin:0" });
  const pic = h("div"); pic.innerHTML = d.svg;
  const desc = h("p", { class: "desc", role: "status" }, "Choose a part to see what it does.");
  const btns = d.parts.map(([pid, name, text]) => h("button", { type: "button", class: "btn small", "aria-pressed": "false", onclick: e => {
    box.querySelectorAll(".parts button").forEach(b => b.setAttribute("aria-pressed", String(b === e.currentTarget)));
    pic.querySelectorAll(".dg-part").forEach(g => g.classList.toggle("hl", g.dataset.p === pid));
    desc.replaceChildren(h("b", {}, name + ": "), text);
  } }, name));
  box.append(h("figcaption", {}, h("h3", {}, d.title), h("p", { class: "small muted" }, d.caption)), pic, h("div", { class: "parts" }, btns), desc);
  return box;
}

/* ============ rewards: charms + reward shelf ============ */
const CHARM_NAMES = { book: "Little book", cup: "Coffee cup", lamp: "Desk lamp", tulip: "Tulips", pearls: "Pearl necklace", bow: "Satin bow", headphones: "Headphones", record: "Record player", moon: "Moon and stars", notebook: "Notebook" };
const DEFAULT_REWARDS = [
  { at: 5, text: "A café drink of your choice", claimed: false },
  { at: 10, text: "New pink stationery", claimed: false },
  { at: 20, text: "Film night: you choose the film", claimed: false },
  { at: 30, text: "A day out of your choice", claimed: false },
  { at: 40, text: "Something special after the mocks", claimed: false }
];
function rewards() { return (state.rewards || DEFAULT_REWARDS).slice().sort((a, b) => a.at - b.at); }
function doneCount() { return SESSIONS.filter(s => state.done[s.n]).length; }
function charmCount() { return Object.keys(state.charms).length; }
function awardCharm(n) {
  if (state.charms[n]) return null;
  const names = Object.keys(CHARM_NAMES);
  const have = {}; Object.values(state.charms).forEach(c => { have[c.name] = (have[c.name] || 0) + 1; });

  let el;
  switch (r.view) {
    case "session": el = sessionView(r.n, r.start); break;
    case "plan": el = planView(); break;
    case "practice": el = practiceView(); break;
    case "progress": el = progressView(); break;
    case "question-decoder": el = decoderView(); break;
    case "topic": el = topicView(r.n); break;
    case "guide": el = guideView(); break;
    case "vocabulary": el = vocabView(); break;
    case "equations": el = equationsView(); break;
    case "how-to-study": el = howView(); break;
    case "exam-tips": el = tipsView(); break;
    case "past-papers": el = papersView(); break;
    case "resources": el = resourcesView(); break;
    default: el = homeView();
  }
  const active = document.activeElement && document.activeElement.id;
  $("#view").replaceWith(Object.assign(el, { id: "view" }));
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.nav === r.nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (active) { const again = document.getElementById(active); if (again && again.tagName === "INPUT") { again.focus(); try { const L = again.value.length; again.setSelectionRange(L, L); } catch (e) {} } }
  if (key !== lastKey) { lastKey = key; window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", () => { if (canSpeak) try { speechSynthesis.cancel(); } catch (e) {} render(); });

/* ============ boot ============ */
Promise.all(["data.json", "content.json", "enrich.json"].map(f => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); })))
  .then(([d, c, e]) => {
    D = d; C = c; E = e;
    SESSIONS = d.SESSIONS; WEEKS = d.WEEKS; SECTIONS = d.SECTIONS; TITLE = d.TITLE;
    render();
    connectShared();
  })
  .catch(() => { $("#view").replaceChildren(h("div", { class: "card" }, h("h2", {}, "The revision content didn't load."), h("p", {}, "Check your internet connection, then reload the page. Your progress is saved."))); });

/* ============ shared progress (optional, alongside localStorage) ============ */
async function connectShared() {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) return;
  try { docRef = db.doc("progress/amelie"); } catch (e) { return; }
  let real = false;
  docRef.onSnapshot(snap => {
    if (!snap.metadata.fromCache) real = true;
    mode = "shared";
    if (snap.exists) {
      if (snap.metadata.hasPendingWrites) return;
      state = normalize(snap.data() || {}); saveLocal();
      const r = currentRoute();
      if (r.view !== "session" && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render();
    } else if (real) {
      if (Object.keys(state.done).length || Object.keys(state.conf).length || Object.keys(state.papers).length) flush();
    }
  }, () => { mode = "local"; });
}
